[include]
files = /etc/supervisor/conf.d/*.conf

[supervisord]
nodaemon=true

[program:php-fpm]
command=docker-php-entrypoint php-fpm
autostart=true
autorestart=true
priority=1

[program:laravel-worker]
; Waits for the Laravel app to exist so the worker does not crash-loop
; before `composer create-project` has been run into this folder.
command=/bin/sh -c 'until [ -f /var/www/artisan ]; do sleep 5; done; exec php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=90'
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/worker.log
